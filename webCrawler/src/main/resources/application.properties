spring.application.name=webCrawler
server.port=8081

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Crawler Default Configuration
crawler.default-max-depth=2
crawler.default-max-pages=20
crawler.connect-timeout-ms=3000
crawler.user-agent=Mozilla/5.0 (compatible; SystemDesignLabCrawler/1.0)
